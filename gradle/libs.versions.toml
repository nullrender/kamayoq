# Versions checked against the official repositories on 2026-10-24 (latest stable).
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
junit-bom = "6.1.3"
sqldelight = "2.4.1" # checked on 2026-10-25; built by its authors with the same AGP, 9.4.1
kotlinx-serialization = "1.12.0" # checked on 2026-10-28; built with Kotlin 2.4.10, Apache-2.0 (GPLv3-compatible, FSF list)
# Test only, never in the APK; checked on 2026-10-29 (Maven Central and Google Maven, latest stable).
# Robolectric 4.17 runs up to API 36, the targetSdk.
robolectric = "4.17"
androidx-test-core = "1.7.0"
junit4 = "4.13.2"
okhttp = "5.5.1" # checked on 2026-10-30 (Maven Central, latest stable); Apache-2.0 (GPLv3-compatible, FSF list)

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
